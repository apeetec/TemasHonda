<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Debug DOM - Sistema de Importação</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { padding: 10px; margin: 5px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .warning { background: #fff3cd; border: 1px solid #ffeaa7; color: #856404; }
    </style>
</head>
<body>
    <h1>🔍 Debug DOM - Sistema de Importação</h1>
    <p>Verificando se todos os elementos necessários estão presentes no DOM.</p>
    <div id="results"></div>
    
    <script>
        function checkElement(id, description) {
            const element = document.getElementById(id);
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            
            if (element) {
                resultDiv.className = 'test-result success';
                resultDiv.innerHTML = `✅ <strong>${id}</strong>: ${description} - ENCONTRADO`;
            } else {
                resultDiv.className = 'test-result error';
                resultDiv.innerHTML = `❌ <strong>${id}</strong>: ${description} - NÃO ENCONTRADO`;
            }
            
            resultsDiv.appendChild(resultDiv);
        }
        
        function simulateImportPage() {
            console.log('🧪 Simulando estrutura da página de importação...');
            
            // Simula os elementos que devem existir na página real
            const elementsToCreate = [
                { id: 'btnDownloadTemplate', tag: 'a', text: 'Download Template' },
                { id: 'uploadSection', tag: 'div', text: 'Upload Section' },
                { id: 'uploadForm', tag: 'form', text: 'Upload Form' },
                { id: 'csvFile', tag: 'input', type: 'file' },
                { id: 'fileInfo', tag: 'div', text: 'File Info' },
                { id: 'fileName', tag: 'span', text: 'File Name' },
                { id: 'fileSize', tag: 'span', text: 'File Size' },
                { id: 'btnUpload', tag: 'button', text: 'Upload Button' },
                { id: 'progressContainer', tag: 'div', text: 'Progress Container' },
                { id: 'progressFill', tag: 'div', text: 'Progress Fill' },
                { id: 'progressText', tag: 'div', text: 'Progress Text' },
                { id: 'resultsSection', tag: 'div', text: 'Results Section' },
                { id: 'resultsGrid', tag: 'div', text: 'Results Grid' }
            ];
            
            elementsToCreate.forEach(elementInfo => {
                const element = document.createElement(elementInfo.tag);
                element.id = elementInfo.id;
                if (elementInfo.text) element.textContent = elementInfo.text;
                if (elementInfo.type) element.type = elementInfo.type;
                document.body.appendChild(element);
            });
            
            console.log('✅ Elementos simulados criados');
        }
        
        function runTests() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<h2>📋 Resultados dos Testes:</h2>';
            
            // Simula a página primeiro
            simulateImportPage();
            
            // Lista de elementos que devem existir
            const requiredElements = [
                { id: 'btnDownloadTemplate', desc: 'Botão de download do template' },
                { id: 'uploadSection', desc: 'Seção de upload' },
                { id: 'uploadForm', desc: 'Formulário de upload' },
                { id: 'csvFile', desc: 'Input de arquivo CSV' },
                { id: 'fileInfo', desc: 'Informações do arquivo' },
                { id: 'fileName', desc: 'Nome do arquivo' },
                { id: 'fileSize', desc: 'Tamanho do arquivo' },
                { id: 'btnUpload', desc: 'Botão de upload' },
                { id: 'progressContainer', desc: 'Container do progresso' },
                { id: 'progressFill', desc: 'Barra de progresso' },
                { id: 'progressText', desc: 'Texto do progresso' },
                { id: 'resultsSection', desc: 'Seção de resultados (ELEMENTO CRÍTICO)' },
                { id: 'resultsGrid', desc: 'Grid de resultados' }
            ];
            
            requiredElements.forEach(element => {
                checkElement(element.id, element.desc);
            });
            
            // Teste específico da função problemática
            const testDiv = document.createElement('div');
            testDiv.className = 'test-result warning';
            testDiv.innerHTML = `
                <h3>🔧 Teste da Função createStatsContainer():</h3>
                <p>A função corrigida agora:</p>
                <ul>
                    <li>✅ Busca por 'resultsSection' (ID correto)</li>
                    <li>✅ Verifica se o elemento existe antes de usar</li>
                    <li>✅ Tem fallback para anexar ao body se necessário</li>
                    <li>✅ Verifica se tem firstChild antes de insertBefore</li>
                </ul>
            `;
            resultsDiv.appendChild(testDiv);
            
            console.log('🎉 Todos os testes concluídos!');
        }
        
        // Executa os testes quando a página carrega
        window.onload = runTests;
    </script>
</body>
</html>
